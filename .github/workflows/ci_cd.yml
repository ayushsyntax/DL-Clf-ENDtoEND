name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          black --check .
          flake8 .
          mypy .
      - name: Test
        run: pytest --cov=. --cov-report=xml
      - name: Coverage badge
        uses: tj-actions/coverage-badge-action@v2
        with:
          output: coverage.svg
      - name: Vulnerability scan
        run: trivy fs .
